name: 量化Agent
on:
  schedule:
    - cron: "30-59/5 1 * * 1-5"
    - cron: "*/5 2 * * 1-5"
    - cron: "0-30/5 3 * * 1-5"
    - cron: "*/5 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "运行哪个任务（第一次选 init）"
        type: choice
        options: [init, intraday, postmarket]
        default: init

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: 解压项目
        run: unzip -oq gann-chan.zip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gann-chan/requirements.txt
      - run: pip install -r gann-chan/requirements.txt
      - name: 运行任务
        working-directory: gann-chan
        env:
          JOB: ${{ inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$JOB" ]; then
            case "$SCHEDULE" in
              "30 10 * * 1-5"|"30 13 * * 1-5") JOB=postmarket ;;
              *) JOB=intraday ;;
            esac
          fi
          echo "本次任务：$JOB"
          if [ "$JOB" = "init" ]; then
            python -m server.export_static
            python -m server.agents.postmarket --force
          elif [ "$JOB" = "postmarket" ]; then
            python -m server.agents.postmarket
          else
            python -m server.agents.intraday
          fi
      - name: 保存数据
        id: commit
        run: |
          git config user.name quant-bot
          git config user.email quant-bot@users.noreply.github.com
          git add gann-chan/web/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -qm "data $(TZ=Asia/Shanghai date +'%F %T')"
            git pull --rebase -q
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gann-chan/web

  deploy:
    needs: run
    if: needs.run.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
